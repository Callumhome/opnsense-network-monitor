name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name opnsense_network_monitor android_scaffold
          cp -a android_scaffold/android ./android

      - name: Configure Android network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in content:
              content = re.sub(r"(<manifest\\b[^>]*>)", r"\\1\\n    " + permission, content, count=1)

          # The app connects to the user-configured backend over HTTP.
          content = re.sub(
              r'<application\b([^>]*)>',
              lambda m: '<application' + m.group(1) + (
                  ' android:usesCleartextTraffic="true"'
                  if 'android:usesCleartextTraffic=' not in m.group(1)
                  else ''
              ) + '>',
              content,
              count=1,
          )

          manifest.write_text(content)
          print("Configured INTERNET permission and cleartext HTTP for backend connectivity.")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opnsense-network-monitor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
